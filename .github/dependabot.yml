version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: dev
    groups:
      desarrollo:
        dependency-type: development
        update-types:
          - minor
          - patch
      produccion:
        dependency-type: production
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
